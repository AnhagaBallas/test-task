name: CI — Tests & Deploy to main

on:
  push:
    branches:
      - source
  pull_request:
    branches:
      - source

jobs:
  test:
    name: Run Vitest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

 
  deploy-to-main:
    name: Deploy to main (without solution)
    runs-on: ubuntu-latest
    needs: test  
    if: github.event_name == 'push' && github.ref == 'refs/heads/source'

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0  

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove solution file
        run: |
          rm -f src/calculator.solution.js
          echo "Removed src/calculator.solution.js"

      - name: Checkout or create main branch
        run: |
          # Проверяем существует ли ветка main на удалённом репозитории
          if git ls-remote --exit-code --heads origin main; then
            echo "Branch main exists, fetching..."
            git fetch origin main
            git checkout main
            
            # Копируем все файлы из source
            git checkout source -- .
            
            # Удаляем файл решения
            rm -f src/calculator.solution.js
            
            echo "Updated main from source"
          else
            echo "Branch main does not exist, creating orphan branch..."
            git checkout --orphan main
            
            # Удаляем файл решения из рабочего дерева
            rm -f src/calculator.solution.js
            
            echo "Created new main branch"
          fi

      - name: Commit changes to main
        run: |
          git add -A
          
          # Коммитим только если есть изменения
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync from source (tests passed) [skip ci]"
            echo "Changes committed"
          fi

      - name: Push to main
        run: |
          git push origin main --force
          echo "Pushed to main"